<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทดสอบยกเข่า 3 นาที</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --border: #334155;
    --pass: #22c55e; --fail: #ef4444; --accent: #38bdf8;
    --warn: #f59e0b; --text: #f8fafc; --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Sarabun', sans-serif;
    overflow: hidden; user-select: none; display: flex; flex-direction: column;
  }

  /* Viewport กล้อง */
  #viewport {
    position: relative; flex: 1; background: #000;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #video { width: 100%; height: 100%; object-fit: cover; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .mirrored { transform: scaleX(-1); }

  /* Top Bar */
  #topBar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 12px 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
    display: flex; justify-content: space-between; align-items: center; z-index: 20;
  }
  #timer { font-size: 1.6rem; font-weight: 800; color: var(--warn); font-variant-numeric: tabular-nums; }
  .btn-sm {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  }

  /* ตัวเลขนับครั้ง */
  #countBox {
    position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; z-index: 10;
  }
  #countNum {
    font-size: 7.5rem; font-weight: 900; line-height: 1; color: var(--accent);
    text-shadow: 0 4px 20px rgba(0,0,0,0.85);
  }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.06s; z-index: 15; }

  /* สถานะแนะนำ */
  #guideText {
    position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
    padding: 6px 18px; border-radius: 20px; font-weight: 700; font-size: 0.85rem;
    background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); z-index: 20;
    white-space: nowrap;
  }

  /* คอนโทรลพาเนลด้านล่าง */
  #panel {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; z-index: 30;
  }
  .adjust-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 0.85rem; color: var(--muted);
  }
  .adjust-btns { display: flex; gap: 8px; }
  .btn-adj {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 4px 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
  }

  .btn-main {
    width: 100%; padding: 14px; font-size: 1.15rem; font-weight: 800;
    border: none; border-radius: 10px; cursor: pointer; background: var(--accent); color: #041325;
    transition: transform 0.1s;
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-main.running { background: var(--fail); color: #fff; }

  /* Overlay เต็มจอ */
  .overlay-screen {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 50; padding: 20px; text-align: center;
  }
  .hidden { display: none !important; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <!-- จอโหลด -->
  <div id="loader" class="overlay-screen">
    <div class="spinner"></div>
    <div id="loadText">กำลังเปิดกล้องและเชื่อมต่อระบบตรวจจับ...</div>
  </div>

  <!-- จอสรุปผล -->
  <div id="endScreen" class="overlay-screen hidden">
    <h2>สิ้นสุดการทดสอบ 3 นาที</h2>
    <div id="finalScore" style="font-size:6rem; font-weight:900; color:var(--pass);">0</div>
    <p style="color:var(--muted);">จำนวนครั้งที่ยกเข่าแตะเส้นไกด์</p>
    <button class="btn-main" style="max-width:240px; margin-top:12px;" onclick="resetTest()">ทดสอบคนต่อไป</button>
  </div>

  <!-- มุมมองกล้อง -->
  <div id="viewport">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="flash"></div>

    <div id="topBar">
      <div id="timer">3:00</div>
      <button class="btn-sm" onclick="switchCamera()">🔄 สลับกล้อง</button>
    </div>

    <div id="guideText">ยืนให้เห็นช่วงเอวเพื่อจับระดับ</div>

    <div id="countBox">
      <div id="countNum">0</div>
      <div style="font-size:0.95rem; color:var(--muted);">ครั้ง</div>
    </div>
  </div>

  <!-- คอนโทรลพาเนล -->
  <div id="panel">
    <div class="adjust-row">
      <span>ปรับเส้นไกด์เป้าหมาย:</span>
      <div class="adjust-btns">
        <button class="btn-adj" onclick="adjustTargetLine(-10)">▲ ขยับขึ้น</button>
        <button class="btn-adj" onclick="adjustTargetLine(10)">▼ ขยับลง</button>
      </div>
    </div>
    <button id="btnAction" class="btn-main" onclick="toggleRunning()">▶ เริ่มทดสอบ</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.10.0/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
// ── พารามิเตอร์ ─────────────────────────────────────────────
const TOTAL_SEC         = 180;
const MIN_CONF          = 0.15;
const THRESHOLD_UP      = 5;    // px เหนือเส้น = เข่าถึงระดับ
const THRESHOLD_DOWN    = 30;   // px ใต้เส้น  = เข่าลงครบ → นับ
const COOLDOWN_MS       = 350;
const SMOOTH_ALPHA      = 0.45; // exponential smoothing
const HIP_STABLE_FRAMES = 8;   // frame ต่อเนื่องที่ต้องพบสะโพกก่อน auto-lock

// ── ตัวแปรสถานะ ────────────────────────────────────────────
let detector = null;
let isRunning = false;
let startTime = 0;
let repCount = 0;
let currentCam = 'user';

let targetLineY       = null;
let isLineLocked      = false;
let isKneeUp          = false;
let lastCountTimestamp = 0;
let smoothKneeY       = null;
let smoothHipY        = null;
let hipStableCount    = 0;

// ── อ้างอิง DOM ───────────────────────────────────────────
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const loader = document.getElementById('loader');
const loadText = document.getElementById('loadText');
const endScreen = document.getElementById('endScreen');
const finalScore = document.getElementById('finalScore');
const btnAction = document.getElementById('btnAction');
const timerDisp = document.getElementById('timer');
const countNum = document.getElementById('countNum');
const guideText = document.getElementById('guideText');
const flash = document.getElementById('flash');

// ── ระบบเสียง Beep ────────────────────────────────────────
let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  } catch(e) {}
}

// ── กล้อง ─────────────────────────────────────────────────
async function initCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const isPortrait = window.innerHeight > window.innerWidth;
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: currentCam,
      width: { ideal: isPortrait ? 720 : 1280 },
      height: { ideal: isPortrait ? 1280 : 720 }
    },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  if (currentCam === 'user') {
    video.classList.add('mirrored');
    canvas.classList.add('mirrored');
  } else {
    video.classList.remove('mirrored');
    canvas.classList.remove('mirrored');
  }
}

async function switchCamera() {
  currentCam = (currentCam === 'user') ? 'environment' : 'user';
  isLineLocked = false;
  targetLineY = null;
  await initCamera();
}

function adjustTargetLine(offset) {
  if (targetLineY !== null) {
    targetLineY += offset;
  }
}

// ── Detection Loop ────────────────────────────────────────
async function detectLoop() {
  let poses = [];
  if (detector) {
    try { poses = await detector.estimatePoses(video); } catch(e) {}
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (poses.length > 0 && poses[0].score > 0.12) {
    processPose(poses[0].keypoints);
  } else {
    if (!isLineLocked) {
      guideText.textContent = 'ยืนให้กล้องเห็นช่วงเอว/สะโพก';
      guideText.style.color = 'var(--muted)';
    }
  }

  if (isRunning) updateTimer();
  requestAnimationFrame(detectLoop);
}

// ── คำนวณและนับรอบ ─────────────────────────────────────────
function processPose(kp) {
  const get = name => kp.find(k => k.name === name);
  const lHip  = get('left_hip'),  rHip  = get('right_hip');
  const lKnee = get('left_knee'), rKnee = get('right_knee');

  const lHipOK  = lHip  && lHip.score  > MIN_CONF;
  const rHipOK  = rHip  && rHip.score  > MIN_CONF;
  const lKneeOK = lKnee && lKnee.score > MIN_CONF;
  const rKneeOK = rKnee && rKnee.score > MIN_CONF;

  // ── AUTO-LOCK สะโพก ──────────────────────────────────────
  // ไม่ต้องกดปุ่ม calibrate:
  // พบสะโพก HIP_STABLE_FRAMES frame ต่อเนื่อง → lock อัตโนมัติ
  if (!isLineLocked) {
    let rawHipY = null;
    if (lHipOK && rHipOK) rawHipY = (lHip.y + rHip.y) / 2;
    else if (lHipOK)       rawHipY = lHip.y;
    else if (rHipOK)       rawHipY = rHip.y;

    if (rawHipY !== null) {
      // smooth ค่าสะโพกก่อน lock เพื่อไม่ให้กระตุก
      smoothHipY = smoothHipY === null
        ? rawHipY
        : smoothHipY * 0.7 + rawHipY * 0.3;
      hipStableCount++;

      guideText.textContent = `ตรวจพบสะโพก… (${hipStableCount}/${HIP_STABLE_FRAMES})`;
      guideText.style.color = 'var(--warn)';

      // ครบ stable frames → lock เส้นอัตโนมัติ ไม่ต้องกดปุ่ม
      if (hipStableCount >= HIP_STABLE_FRAMES) {
        targetLineY  = smoothHipY;
        isLineLocked = true;
        guideText.textContent = 'ล็อกระดับแล้ว — กดเริ่มทดสอบ';
        guideText.style.color = 'var(--pass)';
      }
    } else {
      // ไม่พบสะโพก → reset นับ
      hipStableCount = 0;
      smoothHipY = null;
      guideText.textContent = 'ยืนให้กล้องเห็นช่วงเอว/สะโพก';
      guideText.style.color = 'var(--muted)';
    }
  }

  // แสดงเส้นไกด์
  if (targetLineY !== null) drawTargetLine(targetLineY);

  // ── หาเข่าที่ยกสูงสุด ───────────────────────────────────
  let bestKnee = null;
  if (lKneeOK && rKneeOK) bestKnee = lKnee.y < rKnee.y ? lKnee : rKnee;
  else if (lKneeOK)        bestKnee = lKnee;
  else if (rKneeOK)        bestKnee = rKnee;

  if (bestKnee && targetLineY !== null) {
    // Exponential smoothing ลด noise
    smoothKneeY = smoothKneeY === null
      ? bestKnee.y
      : smoothKneeY * (1 - SMOOTH_ALPHA) + bestKnee.y * SMOOTH_ALPHA;

    const isAbove = smoothKneeY <= (targetLineY - THRESHOLD_UP);
    const isReset = smoothKneeY >= (targetLineY + THRESHOLD_DOWN);

    drawKneeMarker(bestKnee.x, bestKnee.y, isAbove);

    // ── Schmitt Trigger + Falling Edge Count ────────────────
    if (isRunning) {
      const now = performance.now();
      if (isAbove && !isKneeUp) isKneeUp = true;
      if (isKneeUp && isReset && (now - lastCountTimestamp) > COOLDOWN_MS) {
        isKneeUp           = false;
        lastCountTimestamp = now;
        triggerCount();
      }
    }
  }
}

function triggerCount() {
  repCount++;
  countNum.textContent = repCount;
  
  // แจ้งเตือนด้วยแสงวาบและเสียง
  flash.style.background = 'rgba(34, 197, 94, 0.35)';
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 60);
  playBeep();
}

// ── เครื่องมือวาดบน Canvas ────────────────────────────────
function drawTargetLine(y) {
  ctx.save();
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 3.5;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(canvas.width, y);
  ctx.stroke();

  ctx.fillStyle = '#f59e0b';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(isLineLocked ? '◀ เป้าหมายระดับเข่า (ล็อกแล้ว)' : '◀ ระดับเอวปัจจุบัน', 12, y - 8);
  ctx.restore();
}

function drawKneeMarker(x, y, isPassed) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 14, 0, Math.PI * 2);
  ctx.fillStyle = isPassed ? '#22c55e' : '#ef4444';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.restore();
}

// ── นาฬิกาและการควบคุม ─────────────────────────────────────
function updateTimer() {
  const elapsed = (performance.now() - startTime) / 1000;
  const remain = Math.max(0, TOTAL_SEC - elapsed);
  const m = Math.floor(remain / 60);
  const s = Math.floor(remain % 60);
  timerDisp.textContent = `${m}:${s.toString().padStart(2, '0')}`;

  if (remain <= 10) timerDisp.style.color = 'var(--fail)';
  if (remain <= 0) finishTest();
}

function toggleRunning() {
  if (!isRunning) {
    if (!isLineLocked || targetLineY === null) {
      guideText.textContent = 'รอตรวจพบสะโพกก่อน…';
      guideText.style.color = 'var(--fail)';
      return;
    }
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isRunning      = true;
    repCount       = 0;
    smoothKneeY    = null;
    isKneeUp       = false;
    lastCountTimestamp = 0;
    countNum.textContent = '0';
    startTime = performance.now();
    btnAction.textContent = '⏹ สิ้นสุดการทดสอบ';
    btnAction.classList.add('running');
    guideText.textContent = 'ยกเข่าให้แตะเส้นสีส้ม';
    guideText.style.color = 'var(--accent)';
  } else {
    finishTest();
  }
}

function finishTest() {
  isRunning = false;
  btnAction.textContent = '▶ เริ่มใหม่';
  btnAction.classList.remove('running');
  finalScore.textContent = repCount;
  endScreen.classList.remove('hidden');
}

function resetTest() {
  endScreen.classList.add('hidden');
  // ล้าง state ทั้งหมด → ระบบจะ auto-lock ใหม่ทันทีที่เห็นสะโพก
  repCount           = 0;
  smoothKneeY        = null;
  smoothHipY         = null;
  hipStableCount     = 0;
  isKneeUp           = false;
  isLineLocked       = false;
  targetLineY        = null;
  lastCountTimestamp = 0;
  countNum.textContent  = '0';
  timerDisp.textContent = '3:00';
  timerDisp.style.color = 'var(--warn)';
  btnAction.textContent = '▶ เริ่มทดสอบ';
  btnAction.classList.remove('running');
  guideText.textContent = 'ยืนให้กล้องเห็นช่วงเอว/สะโพก';
  guideText.style.color = 'var(--muted)';
}

// ── เริ่มต้นระบบ ──────────────────────────────────────────
async function main() {
  try {
    loadText.textContent = 'กำลังเปิดกล้อง...';
    await initCamera();
    loadText.textContent = 'กำลังโหลดระบบตรวจจับ...';
    detector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
    );
    loader.classList.add('hidden');
    detectLoop();
  } catch (err) {
    loadText.innerHTML = `<span style="color:var(--fail)">ข้อผิดพลาด: ${err.message}</span>`;
  }
}

window.addEventListener('DOMContentLoaded', main);
</script>
</body>
</html>

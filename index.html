<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ทดสอบยกเข่า 3 นาที</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --border: #334155;
    --pass: #22c55e; --fail: #ef4444; --accent: #38bdf8;
    --warn: #f59e0b; --text: #f8fafc; --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
  body {
    width: 100vw; height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Sarabun', sans-serif;
    overflow: hidden; user-select: none; display: flex; flex-direction: column;
  }

  /* ส่วนแสดงภาพกล้อง */
  #viewport {
    position: relative; flex: 1; background: #000;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #video {
    position: absolute; width: 100%; height: 100%; object-fit: contain;
  }
  #canvas {
    position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 5;
  }
  .mirrored { transform: scaleX(-1); }

  /* แถบด้านบน */
  #topBar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
    display: flex; justify-content: space-between; align-items: center; z-index: 20;
  }
  #timer { font-size: 1.6rem; font-weight: 800; color: var(--warn); font-variant-numeric: tabular-nums; }
  .btn-sm {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  }

  /* ตัวเลขนับครั้ง */
  #countBox {
    position: absolute; top: 28%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; z-index: 10;
  }
  #countNum {
    font-size: 7.5rem; font-weight: 900; line-height: 1; color: var(--accent);
    text-shadow: 0 4px 20px rgba(0,0,0,0.85);
  }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.06s; z-index: 15; }

  #guideText {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem;
    background: rgba(15, 23, 42, 0.88); border: 1px solid var(--border); z-index: 20;
    white-space: nowrap; pointer-events: none;
  }

  /* แผงควบคุมด้านล่าง */
  #panel {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; z-index: 30;
  }
  .btn-main {
    width: 100%; padding: 14px; font-size: 1.15rem; font-weight: 800;
    border: none; border-radius: 10px; cursor: pointer; background: var(--accent); color: #041325;
  }
  .btn-main.running { background: var(--fail); color: #fff; }

  /* Overlay โหลดและจบการทดสอบ */
  .overlay-screen {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 50; padding: 20px; text-align: center;
  }
  .hidden { display: none !important; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div id="loader" class="overlay-screen">
    <div class="spinner"></div>
    <div id="loadText">กำลังเปิดกล้องและเชื่อมต่อระบบตรวจจับ...</div>
  </div>

  <div id="endScreen" class="overlay-screen hidden">
    <h2>สิ้นสุดการทดสอบ 3 นาที</h2>
    <div id="finalScore" style="font-size:6rem; font-weight:900; color:var(--pass);">0</div>
    <p style="color:var(--muted);">จำนวนครั้งที่ยกเข่าผ่านเกณฑ์สมบูรณ์</p>
    <button class="btn-main" style="max-width:240px; margin-top:12px;" onclick="resetTest()">ทดสอบคนต่อไป</button>
  </div>

  <div id="viewport">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="flash"></div>

    <div id="topBar">
      <div id="timer">3:00</div>
      <div style="display:flex; gap:8px;">
        <button class="btn-sm" onclick="autoSetWaist()">🎯 ดึงระดับเอว</button>
        <button class="btn-sm" onclick="switchCamera()">🔄 สลับกล้อง</button>
      </div>
    </div>

    <div id="guideText">ใช้นิ้วแตะหรือลากเส้นสีส้มไปไว้ที่ระดับเอว</div>

    <div id="countBox">
      <div id="countNum">0</div>
      <div style="font-size:0.95rem; color:var(--muted);">ครั้ง</div>
    </div>
  </div>

  <div id="panel">
    <button id="btnAction" class="btn-main" onclick="toggleRunning()">▶ เริ่มการทดสอบ</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.10.0/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
const TOTAL_SEC = 180;
const MIN_CONF = 0.15;
const RESET_GAP_PX = 65; // ระยะห่างระหว่างเส้นเป้าหมายกับเส้นรีเซ็ต ป้องกันการสั่นสะบัดนับซ้ำ

let detector = null;
let isRunning = false;
let startTime = 0;
let repCount = 0;
let currentCam = 'user';

// ตำแหน่งเส้นเป้าหมาย (เริ่มต้นไว้ที่ 55% ของความสูงภาพ)
let targetLineY = null;
let stepState = 'WAITING_PEAK';
let detectedHipY = null;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const loader = document.getElementById('loader');
const loadText = document.getElementById('loadText');
const endScreen = document.getElementById('endScreen');
const finalScore = document.getElementById('finalScore');
const btnAction = document.getElementById('btnAction');
const timerDisp = document.getElementById('timer');
const countNum = document.getElementById('countNum');
const guideText = document.getElementById('guideText');
const flash = document.getElementById('flash');

let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  } catch(e) {}
}

async function initCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const isPortrait = window.innerHeight > window.innerWidth;
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: currentCam,
      width: { ideal: isPortrait ? 720 : 1280 },
      height: { ideal: isPortrait ? 1280 : 720 }
    },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // กำหนดตำแหน่งเริ่มต้นที่กึ่งกลางค่อนล่างของจอ
  if (targetLineY === null) {
    targetLineY = Math.round(canvas.height * 0.55);
  }

  if (currentCam === 'user') {
    video.classList.add('mirrored');
    canvas.classList.add('mirrored');
  } else {
    video.classList.remove('mirrored');
    canvas.classList.remove('mirrored');
  }
}

async function switchCamera() {
  currentCam = (currentCam === 'user') ? 'environment' : 'user';
  await initCamera();
}

// ── ระบบใช้นิ้วแตะหรือลากเส้นไกด์ (Touch & Drag) ──────────
function handlePointer(e) {
  const rect = canvas.getBoundingClientRect();
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  // แปลงพิกัดการสัมผัสบนจอให้ตรงกับความละเอียดของภาพวิดีโอ 1:1
  const scaleY = canvas.height / rect.height;
  const newY = (clientY - rect.top) * scaleY;

  if (newY > 50 && newY < canvas.height - 100) {
    targetLineY = Math.round(newY);
    guideText.textContent = 'ปรับระดับแล้ว พร้อมทดสอบ';
    guideText.style.color = 'var(--pass)';
  }
}

canvas.addEventListener('touchstart', handlePointer, { passive: false });
canvas.addEventListener('touchmove', handlePointer, { passive: false });
canvas.addEventListener('mousedown', (e) => {
  handlePointer(e);
  const onMouseMove = (ev) => handlePointer(ev);
  const onMouseUp = () => {
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
  };
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
});

function autoSetWaist() {
  if (detectedHipY !== null) {
    targetLineY = detectedHipY;
    guideText.textContent = 'ดึงระดับเอวจากกล้องสำเร็จ';
    guideText.style.color = 'var(--pass)';
  } else {
    alert('กล้องยังไม่พบสะโพก ใช้นิ้วแตะลากเส้นสีส้มแทนได้เลย');
  }
}

// ── ลูปประมวลผล ──────────────────────────────────────────
async function detectLoop() {
  let poses = [];
  if (detector) {
    try { poses = await detector.estimatePoses(video); } catch(e) {}
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (poses.length > 0 && poses[0].score > 0.12) {
    processPose(poses[0].keypoints);
  }

  // แสดงเส้นเป้าหมาย (ส้ม) และเส้นรีเซ็ต (ฟ้า) เสมอ
  if (targetLineY !== null) {
    drawDualLines(targetLineY, targetLineY + RESET_GAP_PX);
  }

  if (isRunning) updateTimer();
  requestAnimationFrame(detectLoop);
}

function processPose(kp) {
  const get = name => kp.find(k => k.name === name);
  const lHip = get('left_hip'), rHip = get('right_hip');
  const lKnee = get('left_knee'), rKnee = get('right_knee');

  // บันทึกตำแหน่งสะโพกเผื่อผู้ใช้กดปุ่ม Auto
  const lHipOK = lHip && lHip.score > MIN_CONF;
  const rHipOK = rHip && rHip.score > MIN_CONF;
  if (lHipOK && rHipOK) detectedHipY = Math.round((lHip.y + rHip.y) / 2);
  else if (lHipOK) detectedHipY = Math.round(lHip.y);
  else if (rHipOK) detectedHipY = Math.round(rHip.y);

  // หาพิกัดหัวเข่าข้างที่ยกสูงที่สุด (Y น้อยที่สุด)
  let bestKnee = null;
  const lKneeOK = lKnee && lKnee.score > MIN_CONF;
  const rKneeOK = rKnee && rKnee.score > MIN_CONF;

  if (lKneeOK && rKneeOK) bestKnee = (lKnee.y < rKnee.y) ? lKnee : rKnee;
  else if (lKneeOK) bestKnee = lKnee;
  else if (rKneeOK) bestKnee = rKnee;

  if (bestKnee && targetLineY !== null) {
    const isAboveTarget = bestKnee.y <= targetLineY;
    const isBelowReset  = bestKnee.y >= (targetLineY + RESET_GAP_PX);

    drawKneeMarker(bestKnee.x, bestKnee.y, isAboveTarget);

    // ลอจิกการนับ: สองเกณฑ์ป้องกันการนับเบิ้ล
    if (isRunning) {
      if (stepState === 'WAITING_PEAK') {
        if (isAboveTarget) {
          repCount++;
          countNum.textContent = repCount;
          triggerCountFeedback();
          
          stepState = 'WAITING_DROP';
          guideText.textContent = '⬇ วางขาลงให้พ้นเส้นฟ้า';
          guideText.style.color = 'var(--accent)';
        }
      } else if (stepState === 'WAITING_DROP') {
        if (isBelowReset) {
          stepState = 'WAITING_PEAK';
          guideText.textContent = '⬆ ยกเข่าแตะเส้นส้ม';
          guideText.style.color = 'var(--text)';
        }
      }
    }
  }
}

function triggerCountFeedback() {
  flash.style.background = 'rgba(34, 197, 94, 0.35)';
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 60);
  playBeep();
}

function drawDualLines(targetY, resetY) {
  ctx.save();
  // 1. เส้นเป้าหมาย (ส้ม) - ลากปรับได้
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, targetY);
  ctx.lineTo(canvas.width, targetY);
  ctx.stroke();

  ctx.fillStyle = '#f59e0b';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('◀ เส้นเป้าหมาย (แตะหน้าจอเพื่อเลื่อน)', 12, targetY - 8);

  // 2. เส้นปล่อยขากลับ (ฟ้า)
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(0, resetY);
  ctx.lineTo(canvas.width, resetY);
  ctx.stroke();

  ctx.fillStyle = '#38bdf8';
  ctx.font = '13px sans-serif';
  ctx.fillText('◀ เส้นปล่อยขากลับ', 12, resetY + 18);

  ctx.restore();
}

function drawKneeMarker(x, y, isPassed) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 14, 0, Math.PI * 2);
  ctx.fillStyle = isPassed ? '#22c55e' : '#ef4444';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.restore();
}

function updateTimer() {
  const elapsed = (performance.now() - startTime) / 1000;
  const remain = Math.max(0, TOTAL_SEC - elapsed);
  const m = Math.floor(remain / 60);
  const s = Math.floor(remain % 60);
  timerDisp.textContent = `${m}:${s.toString().padStart(2, '0')}`;

  if (remain <= 10) timerDisp.style.color = 'var(--fail)';
  if (remain <= 0) finishTest();
}

function toggleRunning() {
  if (!isRunning) {
    isRunning = true;
    repCount = 0;
    countNum.textContent = '0';
    startTime = performance.now();
    stepState = 'WAITING_PEAK';
    btnAction.textContent = '⏹ สิ้นสุดการทดสอบ';
    btnAction.classList.add('running');
    guideText.textContent = '⬆ ยกเข่าแตะเส้นส้ม';
    guideText.style.color = 'var(--text)';
  } else {
    finishTest();
  }
}

function finishTest() {
  isRunning = false;
  btnAction.textContent = '▶ เริ่มใหม่';
  btnAction.classList.remove('running');
  finalScore.textContent = repCount;
  endScreen.classList.remove('hidden');
}

function resetTest() {
  endScreen.classList.add('hidden');
  repCount = 0;
  countNum.textContent = '0';
  timerDisp.textContent = '3:00';
  timerDisp.style.color = 'var(--warn)';
  stepState = 'WAITING_PEAK';
  btnAction.textContent = '▶ เริ่มการทดสอบ';
  guideText.textContent = 'แตะหรือลากเส้นสีส้มเพื่อปรับระดับ';
  guideText.style.color = 'var(--text)';
}

async function main() {
  try {
    loadText.textContent = 'กำลังเปิดกล้อง...';
    await initCamera();
    loadText.textContent = 'กำลังโหลดระบบตรวจจับ...';
    detector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
    );
    loader.classList.add('hidden');
    detectLoop();
  } catch (err) {
    loadText.innerHTML = `<span style="color:var(--fail)">ข้อผิดพลาด: ${err.message}</span>`;
  }
}

window.addEventListener('DOMContentLoaded', main);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ยกเข่า 3 นาที</title>
<style>
  :root {
    --bg: #0a0f1e; --surface: #111827; --border: #1e293b;
    --pass: #22c55e; --fail: #ef4444; --idle: #3b82f6;
    --text: #f1f5f9; --muted: #64748b; --timer: #f59e0b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
  html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
    font-family:'Sarabun','Noto Sans Thai',sans-serif;overflow:hidden;user-select:none}
  #app{display:flex;flex-direction:column;width:100%;height:100%;position:relative}

  #videoWrap{position:relative;flex:1;background:#000;overflow:hidden}
  #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
  #canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
  #flash{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 0.06s}

  /* Status bar top */
  #statusBar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 16px;
    background:rgba(10,15,30,0.75);backdrop-filter:blur(4px);
  }
  #statusLabel{font-size:1rem;font-weight:700}
  #timerDisplay{font-size:1.5rem;font-weight:800;color:var(--timer);font-variant-numeric:tabular-nums}

  /* Big count center */
  #countOverlay{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-60%);text-align:center;pointer-events:none;
  }
  #countBig{font-size:6rem;font-weight:900;line-height:1;
    text-shadow:0 2px 24px rgba(0,0,0,0.8);transition:color 0.12s}
  #countLabel{font-size:1rem;color:rgba(255,255,255,0.6);margin-top:4px;
    text-shadow:0 1px 6px rgba(0,0,0,0.8)}

  /* Knee level guide line */
  #guideLine{
    position:absolute;left:5%;right:5%;height:3px;border-radius:2px;
    pointer-events:none;display:none;transition:background 0.1s;
  }

  /* Debug bar */
  #dbgBar{
    position:absolute;bottom:6px;left:8px;right:8px;
    background:rgba(0,0,0,0.65);border-radius:8px;
    padding:5px 10px;font-size:0.7rem;color:#94a3b8;
    line-height:1.7;pointer-events:none;
  }

  /* Bottom panel */
  #panel{background:var(--surface);border-top:1px solid var(--border);
    padding:14px 20px;display:flex;flex-direction:column;gap:12px}

  #resultRow{display:flex;gap:10px}
  .stat-box{flex:1;background:var(--bg);border-radius:10px;
    border:1px solid var(--border);padding:10px 12px;
    display:flex;flex-direction:column;gap:3px}
  .stat-label{font-size:0.7rem;color:var(--muted)}
  .stat-val{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums}

  #btnStart{width:100%;padding:16px;font-size:1.15rem;font-weight:800;
    border:none;border-radius:12px;background:var(--idle);color:#fff;
    cursor:pointer;transition:background 0.2s,transform 0.1s}
  #btnStart:active{transform:scale(0.97)}
  #btnStart.running{background:var(--fail)}

  /* Loading */
  #loadScreen{position:absolute;inset:0;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:99;padding:24px;text-align:center}
  #loadScreen.hidden{display:none}
  .spinner{width:44px;height:44px;border:4px solid var(--border);
    border-top-color:var(--idle);border-radius:50%;
    animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadMsg{font-size:1rem;color:var(--muted)}

  /* Done */
  #doneScreen{position:absolute;inset:0;background:rgba(10,15,30,0.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;z-index:50}
  #doneScreen.hidden{display:none}
  #doneScore{font-size:5rem;font-weight:900;color:var(--pass)}
  #doneLabel,#doneUnit{font-size:1.1rem;color:var(--muted)}
  #btnReset{padding:14px 40px;font-size:1.1rem;font-weight:700;
    border:none;border-radius:12px;background:var(--idle);color:#fff;cursor:pointer}

  #poseDot{width:9px;height:9px;border-radius:50%;background:var(--muted);
    display:inline-block;margin-right:6px;vertical-align:middle;transition:background 0.2s}

  @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div id="app">

  <div id="loadScreen">
    <div class="spinner"></div>
    <div id="loadMsg">กำลังโหลด…<br><small style="color:#475569">รอสักครู่</small></div>
  </div>

  <div id="doneScreen" class="hidden">
    <div id="doneLabel">ผลการทดสอบ</div>
    <div id="doneScore">0</div>
    <div id="doneUnit">ครั้ง ใน 3 นาที</div>
    <button id="btnReset" onclick="resetAll()">ทดสอบคนต่อไป</button>
  </div>

  <div id="videoWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="guideLine"></div>
    <div id="flash"></div>

    <div id="statusBar">
      <div id="statusLabel">
        <span id="poseDot"></span>
        <span id="statusText">กำลังโหลด…</span>
      </div>
      <div id="timerDisplay">3:00</div>
    </div>

    <div id="countOverlay">
      <div id="countBig" style="color:var(--idle)">0</div>
      <div id="countLabel">ครั้ง</div>
    </div>

    <div id="dbgBar">
      <span id="dbgPose">Pose:—</span> |
      <span id="dbgHip">Hip L:— R:—</span> |
      <span id="dbgKnee">Knee L:— R:—</span> |
      <span id="dbgAngle">Angle:—°</span> |
      <span id="dbgState">State:—</span>
    </div>
  </div>

  <div id="panel">
    <div id="resultRow">
      <div class="stat-box">
        <div class="stat-label">จำนวนครั้ง</div>
        <div class="stat-val" id="statCount">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">มุมสะโพก</div>
        <div class="stat-val" id="statAngle">—°</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">สถานะ</div>
        <div class="stat-val" id="statStatus" style="font-size:0.9rem">รอ</div>
      </div>
    </div>
    <button id="btnStart" onclick="toggleTest()">▶ เริ่มทดสอบ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.10.0/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
// ── CONFIG ──────────────────────────────────────────
const TOTAL_TIME   = 180;
// มุมสะโพก-เข่า ≥ threshold = ผ่านระดับ (มองจากด้านหน้า ค่า ~55-65 เหมาะสม)
const ANGLE_UP     = 58;   // เข่าขึ้นถึงระดับ
const ANGLE_DOWN   = 35;   // เข่าลงกลับ (ต้องลงพอ ป้องกันนับซ้ำ)
const MIN_CONF     = 0.25;
const COOLDOWN_MS  = 400;  // ms ระหว่างครั้ง ป้องกันนับเร็วเกิน

// ── STATE ────────────────────────────────────────────
let detector=null, count=0, timeLeft=TOTAL_TIME;
let timerInterval=null, isRunning=false, isDone=false;
let kneeUp=false, lastCountTime=0;
let smoothAngle=0; // exponential smoothing

// ── DOM ──────────────────────────────────────────────
const video      = document.getElementById('video');
const canvas     = document.getElementById('canvas');
const ctx        = canvas.getContext('2d');
const loadScreen = document.getElementById('loadScreen');
const loadMsg    = document.getElementById('loadMsg');
const poseDot    = document.getElementById('poseDot');
const statusText = document.getElementById('statusText');
const timerDisp  = document.getElementById('timerDisplay');
const countBig   = document.getElementById('countBig');
const guideLine  = document.getElementById('guideLine');
const flash      = document.getElementById('flash');
const statCount  = document.getElementById('statCount');
const statAngle  = document.getElementById('statAngle');
const statStatus = document.getElementById('statStatus');
const btnStart   = document.getElementById('btnStart');
const doneScreen = document.getElementById('doneScreen');
const doneScore  = document.getElementById('doneScore');
const dbgPose    = document.getElementById('dbgPose');
const dbgHip     = document.getElementById('dbgHip');
const dbgKnee    = document.getElementById('dbgKnee');
const dbgAngle   = document.getElementById('dbgAngle');
const dbgState   = document.getElementById('dbgState');

// ── AUDIO ─────────────────────────────────────────────
let audioCtx=null;
function beep(freq=880,dur=0.08,vol=0.4){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

// ── CAMERA ───────────────────────────────────────────
async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:'user', width:{ideal:480}, height:{ideal:640}},
    audio:false
  });
  video.srcObject=stream;
  await new Promise(r=>video.onloadedmetadata=r);
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
}

// ── MODEL: Lightning (เบา เหมาะมือถือ) ──────────────
async function loadModel(){
  detector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet,
    {
      modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
      enableSmoothing: true,   // built-in smoothing ของ MoveNet
      minPoseScore: 0.2
    }
  );
}

// ── ANGLE ────────────────────────────────────────────
// คำนวณมุมที่ b (จุดกลาง) จาก 3 จุด
function calcAngle(a,b,c){
  const ab={x:b.x-a.x, y:b.y-a.y};
  const cb={x:b.x-c.x, y:b.y-c.y};
  const dot=ab.x*cb.x+ab.y*cb.y;
  const cross=Math.abs(ab.x*cb.y-ab.y*cb.x);
  return Math.abs(Math.atan2(cross,dot)*180/Math.PI);
}

// ── DETECT LOOP ──────────────────────────────────────
async function detectLoop(){
  let poses=[];
  try{ poses=await detector.estimatePoses(video); }catch(e){}
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(poses.length>0 && poses[0].score > 0.15){
    const kp  = poses[0].keypoints;
    const get = n => kp.find(k=>k.name===n);

    const lHip=get('left_hip'), lKnee=get('left_knee'), lAnk=get('left_ankle');
    const rHip=get('right_hip'),rKnee=get('right_knee'),rAnk=get('right_ankle');
    const lSh =get('left_shoulder'), rSh=get('right_shoulder');

    const lOK = lHip?.score>MIN_CONF && lKnee?.score>MIN_CONF;
    const rOK = rHip?.score>MIN_CONF && rKnee?.score>MIN_CONF;

    // debug scores
    dbgPose.textContent  = `Pose:${poses[0].score?.toFixed(2)}`;
    dbgHip.textContent   = `Hip L:${lHip?.score?.toFixed(2)??'—'} R:${rHip?.score?.toFixed(2)??'—'}`;
    dbgKnee.textContent  = `Knee L:${lKnee?.score?.toFixed(2)??'—'} R:${rKnee?.score?.toFixed(2)??'—'}`;

    // วาด skeleton ทั้งหมด
    drawSkeleton(kp);

    // คำนวณมุมสะโพก (ใช้ shoulder→hip→knee)
    let rawAngle=0;
    if(lOK){
      const ref = lSh ?? {x:lHip.x, y:lHip.y-120};
      const a   = calcAngle(ref, lHip, lKnee);
      if(a>rawAngle) rawAngle=a;
      drawAngleViz(lHip, lKnee, a, a>=ANGLE_UP);
    }
    if(rOK){
      const ref = rSh ?? {x:rHip.x, y:rHip.y-120};
      const a   = calcAngle(ref, rHip, rKnee);
      if(a>rawAngle) rawAngle=a;
      drawAngleViz(rHip, rKnee, a, a>=ANGLE_UP);
    }

    // Exponential smoothing ลด noise
    smoothAngle = smoothAngle*0.6 + rawAngle*0.4;
    const ang = Math.round(smoothAngle);

    dbgAngle.textContent = `Angle:${ang}°`;
    statAngle.textContent = ang+'°';

    // Guide line ที่ระดับสะโพก
    if((lOK||rOK) && isRunning){
      const hipY = lOK ? lHip.y : rHip.y;
      const pct  = (hipY/canvas.height)*100;
      guideLine.style.top     = pct+'%';
      guideLine.style.display = 'block';
      guideLine.style.background = smoothAngle>=ANGLE_UP ? 'var(--pass)' : 'var(--idle)';
    }

    poseDot.style.background = (lOK||rOK) ? '#22c55e' : '#f59e0b';
    if(!isRunning) statusText.textContent = (lOK||rOK) ? 'พบตัว — พร้อมทดสอบ' : 'พบบางส่วน — ถอยออกให้เห็นทั้งตัว';

    // ── COUNT LOGIC ──
    if(isRunning && (lOK||rOK)){
      const now    = Date.now();
      const passed = smoothAngle >= ANGLE_UP;
      const reset  = smoothAngle <= ANGLE_DOWN;

      countBig.style.color   = passed ? 'var(--pass)' : 'var(--fail)';
      statStatus.textContent = passed ? '✅ ผ่านระดับ' : (kneeUp ? '⬇ ลงให้สุด' : '⬆ ยกให้สูง');
      statStatus.style.color = passed ? 'var(--pass)' : 'var(--muted)';
      dbgState.textContent   = `State:${kneeUp?'UP':'DOWN'} smooth:${ang}°`;

      if(passed && !kneeUp){
        kneeUp = true;
      }
      // นับเมื่อ: เคยขึ้นถึงระดับ + ลงกลับต่ำพอ + cooldown ผ่าน
      if(kneeUp && reset && (now-lastCountTime)>COOLDOWN_MS){
        kneeUp       = false;
        lastCountTime= now;
        count++;
        countBig.textContent  = count;
        statCount.textContent = count;
        flash.style.background= 'rgba(34,197,94,0.28)';
        flash.style.opacity   = '1';
        setTimeout(()=>flash.style.opacity='0', 130);
        beep(880,0.07,0.4);
      }
    }

  } else {
    poseDot.style.background = '#64748b';
    if(!isRunning) statusText.textContent = 'ไม่พบตัว — ถอยออก / ตรวจสอบแสง';
    guideLine.style.display = 'none';
    dbgPose.textContent  = 'Pose: ไม่พบ';
    dbgHip.textContent   = 'Hip: —';
    dbgKnee.textContent  = 'Knee: —';
    dbgAngle.textContent = 'Angle: —°';
    dbgState.textContent = 'State: —';
  }

  requestAnimationFrame(detectLoop);
}

// ── DRAW ─────────────────────────────────────────────
function ln(kp,a,b,c='#60a5fa',w=3){
  const pa=kp.find(k=>k.name===a), pb=kp.find(k=>k.name===b);
  if(!pa||!pb||pa.score<MIN_CONF||pb.score<MIN_CONF) return;
  ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y);
  ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round'; ctx.stroke();
}
function dot(p,c='#f1f5f9',r=5){
  if(!p||p.score<MIN_CONF) return;
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fillStyle=c; ctx.fill();
}
function drawSkeleton(kp){
  const c='#60a5fa';
  ln(kp,'left_shoulder','right_shoulder',c);
  ln(kp,'left_shoulder','left_hip',c);
  ln(kp,'right_shoulder','right_hip',c);
  ln(kp,'left_hip','right_hip',c);
  ln(kp,'left_hip','left_knee',c,4);
  ln(kp,'left_knee','left_ankle',c,3);
  ln(kp,'right_hip','right_knee',c,4);
  ln(kp,'right_knee','right_ankle',c,3);
  ['left_hip','right_hip','left_knee','right_knee','left_ankle','right_ankle'].forEach(n=>{
    dot(kp.find(k=>k.name===n),'#f1f5f9',5);
  });
}
function drawAngleViz(hip,knee,ang,pass){
  if(!hip||hip.score<MIN_CONF) return;
  const c=pass?'#22c55e':'#ef4444';
  ctx.beginPath(); ctx.arc(hip.x,hip.y,22,0,Math.PI*2);
  ctx.strokeStyle=c; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle=c; ctx.font='bold 13px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(Math.round(ang)+'°', hip.x, hip.y-28);
}

// ── TIMER ────────────────────────────────────────────
function fmt(s){ return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

// ── CONTROL ──────────────────────────────────────────
function toggleTest(){ if(!isDone){ isRunning ? stopTest() : startTest(); } }

function startTest(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  isRunning=true; count=0; timeLeft=TOTAL_TIME;
  kneeUp=false; lastCountTime=0; smoothAngle=0;
  countBig.textContent='0'; statCount.textContent='0';
  timerDisp.style.color='var(--timer)';
  timerDisp.textContent='3:00';
  statusText.textContent='กำลังทดสอบ…';
  btnStart.textContent='⏹ หยุดการทดสอบ';
  btnStart.classList.add('running');
  beep(660,0.15,0.5);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerDisp.textContent=fmt(timeLeft);
    if(timeLeft<=10){ timerDisp.style.color='var(--fail)'; beep(660,0.05,0.2); }
    if(timeLeft<=0) endTest();
  },1000);
}

function stopTest(){
  isRunning=false; clearInterval(timerInterval);
  statusText.textContent='หยุดกลางคัน';
  btnStart.textContent='▶ เริ่มใหม่';
  btnStart.classList.remove('running');
  guideLine.style.display='none';
  countBig.style.color='var(--idle)';
  statStatus.textContent='หยุด';
  statStatus.style.color='var(--muted)';
}

function endTest(){
  isRunning=false; isDone=true; clearInterval(timerInterval);
  guideLine.style.display='none';
  doneScore.textContent=count;
  doneScreen.classList.remove('hidden');
  beep(880,0.2,0.5); setTimeout(()=>beep(1100,0.3,0.5),260);
}

function resetAll(){
  isDone=false; count=0; timeLeft=TOTAL_TIME;
  kneeUp=false; lastCountTime=0; smoothAngle=0;
  doneScreen.classList.add('hidden');
  countBig.textContent='0'; countBig.style.color='var(--idle)';
  statCount.textContent='—'; statAngle.textContent='—°';
  statStatus.textContent='รอ'; statStatus.style.color='var(--text)';
  timerDisp.textContent='3:00'; timerDisp.style.color='var(--timer)';
  statusText.textContent='รอเริ่ม';
  btnStart.textContent='▶ เริ่มทดสอบ';
  btnStart.classList.remove('running');
}

// ── INIT ─────────────────────────────────────────────
async function init(){
  try{
    loadMsg.innerHTML='กำลังเปิดกล้อง…';
    await startCamera();
    loadMsg.innerHTML='กำลังโหลดโมเดล…<br><small style="color:#475569">รอสักครู่</small>';
    await loadModel();
    loadScreen.classList.add('hidden');
    statusText.textContent='รอเริ่ม';
    detectLoop();
  }catch(e){
    loadMsg.innerHTML='❌ '+e.message+'<br><small>กรุณาอนุญาตกล้อง แล้วรีเฟรช</small>';
  }
}
init();
</script>
</body>
</html>

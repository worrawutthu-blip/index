<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ระบบทดสอบยกเข่า 3 นาที</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --border: #334155;
    --pass: #22c55e; --fail: #ef4444; --accent: #38bdf8;
    --warn: #f59e0b; --text: #f8fafc; --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
  body {
    width: 100vw; height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Sarabun', sans-serif;
    overflow: hidden; user-select: none; display: flex; flex-direction: column;
  }

  /* ส่วนกล้องแบบเต็มจอ */
  #viewport {
    position: relative; flex: 1; background: #000; overflow: hidden;
  }
  #video, #canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  .mirrored { transform: scaleX(-1); }

  /* แถบด้านบน */
  #topBar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
    display: flex; justify-content: space-between; align-items: center; z-index: 20;
  }
  #timer { font-size: 1.6rem; font-weight: 800; color: var(--warn); font-variant-numeric: tabular-nums; }
  .btn-sm {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  }

  /* ตัวเลขนับคะแนน */
  #countBox {
    position: absolute; top: 24%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; z-index: 10;
  }
  #countNum {
    font-size: 7.5rem; font-weight: 900; line-height: 1; color: var(--accent);
    text-shadow: 0 4px 20px rgba(0,0,0,0.85);
  }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.06s; z-index: 15; }

  #guideText {
    position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
    padding: 5px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem;
    background: rgba(15, 23, 42, 0.88); border: 1px solid var(--border); z-index: 20;
    white-space: nowrap; pointer-events: none;
  }

  /* แผงควบคุมด้านล่าง */
  #panel {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; z-index: 30;
  }
  .adjust-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 0.82rem; color: var(--muted);
  }
  .adjust-btns { display: flex; align-items: center; gap: 6px; }
  .btn-adj {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
  }
  .btn-adj:active { background: var(--border); }
  .val-disp { min-width: 44px; text-align: center; font-weight: 700; color: var(--text); }

  .btn-main {
    width: 100%; padding: 13px; font-size: 1.1rem; font-weight: 800;
    border: none; border-radius: 10px; cursor: pointer; background: var(--accent); color: #041325;
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-main.running { background: var(--fail); color: #fff; }

  /* หน้าจอผลลัพธ์ */
  .overlay-screen {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 50; padding: 20px; text-align: center;
  }
  .hidden { display: none !important; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div id="loader" class="overlay-screen">
    <div class="spinner"></div>
    <div id="loadText">กำลังเปิดกล้องและเชื่อมต่อระบบ...</div>
  </div>

  <div id="endScreen" class="overlay-screen hidden">
    <h2>สิ้นสุดการทดสอบ 3 นาที</h2>
    <div id="finalScore" style="font-size:6rem; font-weight:900; color:var(--pass);">0</div>
    <p style="color:var(--muted);">จำนวนครั้งที่ยกเข่าผ่านเกณฑ์สมบูรณ์</p>
    <button class="btn-main" style="max-width:240px; margin-top:12px;" onclick="resetTest()">ทดสอบคนต่อไป</button>
  </div>

  <div id="viewport">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="flash"></div>

    <div id="topBar">
      <div id="timer">3:00</div>
      <button class="btn-sm" onclick="switchCamera()">🔄 สลับกล้อง</button>
    </div>

    <div id="guideText">ลากเส้นส้ม หรือใช้ปุ่มด้านล่างปรับระดับ</div>

    <div id="countBox">
      <div id="countNum">0</div>
      <div style="font-size:0.95rem; color:var(--muted);">ครั้ง</div>
    </div>
  </div>

  <div id="panel">
    <!-- แถวที่ 1: ปรับระดับเอว (เส้นส้ม) -->
    <div class="adjust-row">
      <span>1. ระดับเอว (เส้นส้ม):</span>
      <div class="adjust-btns">
        <button class="btn-adj" onclick="microAdjustWaist(-0.015)">▲ ขึ้น</button>
        <button class="btn-adj" onclick="microAdjustWaist(0.015)">▼ ลง</button>
      </div>
    </div>

    <!-- แถวที่ 2: ปรับระยะห่าง (เส้นฟ้า) -->
    <div class="adjust-row">
      <span>2. ช่วงปล่อยขา (เส้นฟ้า):</span>
      <div class="adjust-btns">
        <button class="btn-adj" onclick="adjustGap(-0.02)">- แคบลง</button>
        <span class="val-disp" id="gapLabel">10%</span>
        <button class="btn-adj" onclick="adjustGap(0.02)">+ กว้างขึ้น</button>
      </div>
    </div>

    <button id="btnAction" class="btn-main" onclick="toggleRunning()">▶ เริ่มการทดสอบ</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.10.0/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
const TOTAL_SEC = 180;
const MIN_CONF = 0.15;
const COOLDOWN_MS = 280; 

let detector = null;
let isRunning = false;
let startTime = 0;
let repCount = 0;
let currentCam = 'user';

// ตำแหน่งเส้นส้ม (0.15 ถึง 0.80 ของหน้าจอ)
let targetRatio = 0.52; 

// ระยะห่างของเส้นฟ้า (เริ่มต้นที่ 10% ของความสูงจอ ปรับได้ระหว่าง 4% ถึง 25%)
let resetGapRatio = 0.10; 

let stepState = 'WAITING_PEAK';
let lastCountTime = 0;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const loader = document.getElementById('loader');
const loadText = document.getElementById('loadText');
const endScreen = document.getElementById('endScreen');
const finalScore = document.getElementById('finalScore');
const btnAction = document.getElementById('btnAction');
const timerDisp = document.getElementById('timer');
const countNum = document.getElementById('countNum');
const guideText = document.getElementById('guideText');
const flash = document.getElementById('flash');
const gapLabel = document.getElementById('gapLabel');

let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  } catch(e) {}
}

async function initCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const isPortrait = window.innerHeight > window.innerWidth;
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: currentCam,
      width: { ideal: isPortrait ? 720 : 1280 },
      height: { ideal: isPortrait ? 1280 : 720 }
    },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  if (currentCam === 'user') {
    video.classList.add('mirrored');
    canvas.classList.add('mirrored');
  } else {
    video.classList.remove('mirrored');
    canvas.classList.remove('mirrored');
  }
}

async function switchCamera() {
  currentCam = (currentCam === 'user') ? 'environment' : 'user';
  await initCamera();
}

// ── ระบบปรับระดับเส้น ──────────────────────────────────────────
function setRatioFromClientY(clientY) {
  const rect = canvas.getBoundingClientRect();
  const clampedY = Math.max(rect.top + rect.height * 0.15, Math.min(clientY, rect.top + rect.height * 0.75));
  targetRatio = (clampedY - rect.top) / rect.height;
}

canvas.addEventListener('touchstart', (e) => setRatioFromClientY(e.touches[0].clientY), { passive: false });
canvas.addEventListener('touchmove', (e) => setRatioFromClientY(e.touches[0].clientY), { passive: false });

canvas.addEventListener('mousedown', (e) => {
  setRatioFromClientY(e.clientY);
  const onMove = (ev) => setRatioFromClientY(ev.clientY);
  const onUp = () => {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
});

function microAdjustWaist(delta) {
  targetRatio = Math.max(0.15, Math.min(0.75, targetRatio + delta));
}

function adjustGap(delta) {
  resetGapRatio = Math.max(0.04, Math.min(0.25, resetGapRatio + delta));
  gapLabel.textContent = `${Math.round(resetGapRatio * 100)}%`;
}

// ── ลูปประมวลผล ──────────────────────────────────────────────
async function detectLoop() {
  let poses = [];
  if (detector) {
    try { poses = await detector.estimatePoses(video); } catch(e) {}
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const targetY = canvas.height * targetRatio;
  const resetY  = canvas.height * (targetRatio + resetGapRatio);

  drawDualLines(targetY, resetY);

  if (poses.length > 0 && poses[0].score > 0.12) {
    const kp = poses[0].keypoints;
    const lKnee = kp.find(k => k.name === 'left_knee');
    const rKnee = kp.find(k => k.name === 'right_knee');

    const lOK = lKnee && lKnee.score > MIN_CONF;
    const rOK = rKnee && rKnee.score > MIN_CONF;

    let bestKnee = null;
    if (lOK && rOK) bestKnee = (lKnee.y < rKnee.y) ? lKnee : rKnee;
    else if (lOK) bestKnee = lKnee;
    else if (rOK) bestKnee = rKnee;

    if (bestKnee) {
      const isAboveTarget = bestKnee.y <= targetY;
      const isBelowReset  = bestKnee.y >= resetY;

      drawKneeMarker(bestKnee.x, bestKnee.y, isAboveTarget);

      if (isRunning) {
        const now = performance.now();

        if (stepState === 'WAITING_PEAK') {
          if (isAboveTarget && (now - lastCountTime > COOLDOWN_MS)) {
            repCount++;
            lastCountTime = now;
            countNum.textContent = repCount;
            triggerCountFeedback();
            stepState = 'WAITING_DROP';
            guideText.textContent = '⬇ วางขาลงให้พ้นเส้นฟ้า';
            guideText.style.color = 'var(--accent)';
          }
        } else if (stepState === 'WAITING_DROP') {
          if (isBelowReset) {
            stepState = 'WAITING_PEAK';
            guideText.textContent = '⬆ ยกเข่าแตะเส้นส้ม';
            guideText.style.color = 'var(--text)';
          }
        }
      }
    }
  }

  if (isRunning) updateTimer();
  requestAnimationFrame(detectLoop);
}

function triggerCountFeedback() {
  flash.style.background = 'rgba(34, 197, 94, 0.35)';
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 60);
  playBeep();
}

function drawDualLines(targetY, resetY) {
  ctx.save();
  // 1. เส้นส้ม (เป้าหมาย)
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, targetY);
  ctx.lineTo(canvas.width, targetY);
  ctx.stroke();

  ctx.fillStyle = '#f59e0b';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('◀ เส้นเป้าหมายเอว (เส้นส้ม)', 14, targetY - 8);

  // 2. เส้นฟ้า (ปล่อยขา)
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(0, resetY);
  ctx.lineTo(canvas.width, resetY);
  ctx.stroke();

  ctx.fillStyle = '#38bdf8';
  ctx.font = '13px sans-serif';
  ctx.fillText('◀ เส้นปล่อยขากลับ (เส้นฟ้า)', 14, resetY + 18);

  ctx.restore();
}

function drawKneeMarker(x, y, isPassed) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 14, 0, Math.PI * 2);
  ctx.fillStyle = isPassed ? '#22c55e' : '#ef4444';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.restore();
}

function updateTimer() {
  const elapsed = (performance.now() - startTime) / 1000;
  const remain = Math.max(0, TOTAL_SEC - elapsed);
  const m = Math.floor(remain / 60);
  const s = Math.floor(remain % 60);
  timerDisp.textContent = `${m}:${s.toString().padStart(2, '0')}`;

  if (remain <= 10) timerDisp.style.color = 'var(--fail)';
  if (remain <= 0) finishTest();
}

function toggleRunning() {
  if (!isRunning) {
    isRunning = true;
    repCount = 0;
    countNum.textContent = '0';
    startTime = performance.now();
    lastCountTime = 0;
    stepState = 'WAITING_PEAK';
    btnAction.textContent = '⏹ สิ้นสุดการทดสอบ';
    btnAction.classList.add('running');
    guideText.textContent = '⬆ ยกเข่าแตะเส้นส้ม';
    guideText.style.color = 'var(--text)';
  } else {
    finishTest();
  }
}

function finishTest() {
  isRunning = false;
  btnAction.textContent = '▶ เริ่มใหม่';
  btnAction.classList.remove('running');
  finalScore.textContent = repCount;
  endScreen.classList.remove('hidden');
}

function resetTest() {
  endScreen.classList.add('hidden');
  repCount = 0;
  countNum.textContent = '0';
  timerDisp.textContent = '3:00';
  timerDisp.style.color = 'var(--warn)';
  stepState = 'WAITING_PEAK';
  lastCountTime = 0;
  btnAction.textContent = '▶ เริ่มการทดสอบ';
  guideText.textContent = 'ลากเส้นส้ม หรือใช้ปุ่มด้านล่างปรับระดับ';
  guideText.style.color = 'var(--text)';
}

async function main() {
  try {
    loadText.textContent = 'กำลังเปิดกล้อง...';
    await initCamera();
    loadText.textContent = 'กำลังโหลด AI ตรวจจับข้อเข่า...';
    detector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
    );
    loader.classList.add('hidden');
    detectLoop();
  } catch (err) {
    loadText.innerHTML = `<span style="color:var(--fail)">ข้อผิดพลาด: ${err.message}</span>`;
  }
}

window.addEventListener('DOMContentLoaded', main);
</script>
</body>
</html>
